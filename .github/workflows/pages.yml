name: Deploy convite no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Montar foto do casal antes do deploy
        run: |
          python - <<'PY'
          import base64
          parts = []
          for n in range(5):
              with open(f'assets/photo_part{n}.txt', 'r', encoding='utf-8') as f:
                  parts.append(f.read().strip())
          raw = base64.b64decode(''.join(parts), validate=False)
          if raw[:3] != b'\xff\xd8\xff' or raw[-2:] != b'\xff\xd9':
              raise SystemExit('A foto reconstruída não é um JPEG válido.')
          with open('assets/casal-bodas.jpg', 'wb') as f:
              f.write(raw)
          print(f'Foto montada com sucesso: {len(raw)} bytes')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Fazer deploy
        id: deployment
        uses: actions/deploy-pages@v4
