name: Montar foto do convite
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e substituir foto
        run: |
          cat assets/photo_part0.txt assets/photo_part1.txt assets/photo_part2.txt assets/photo_part3.txt assets/photo_part4.txt > /tmp/photo.b64
          base64 -d /tmp/photo.b64 > assets/casal-bodas.jpg
          file assets/casal-bodas.jpg
          rm assets/photo_part0.txt assets/photo_part1.txt assets/photo_part2.txt assets/photo_part3.txt assets/photo_part4.txt
      - name: Publicar foto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/casal-bodas.jpg
          git rm -f --ignore-unmatch assets/photo_part0.txt assets/photo_part1.txt assets/photo_part2.txt assets/photo_part3.txt assets/photo_part4.txt
          git commit -m "Atualizar foto original suavizada do convite" || exit 0
          git push
