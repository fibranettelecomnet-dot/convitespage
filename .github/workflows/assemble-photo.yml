name: Montar foto do convite
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e substituir foto
        run: |
          python - <<'PY'
          import base64
          parts=[]
          for n in range(5):
              with open(f'assets/photo_part{n}.txt','r',encoding='utf-8') as f:
                  parts.append(f.read().strip())
          raw=base64.b64decode(''.join(parts), validate=False)
          print('bytes:', len(raw))
          print('jpeg:', raw[:3] == b'\xff\xd8\xff', 'end:', raw[-2:] == b'\xff\xd9')
          open('assets/casal-bodas.jpg','wb').write(raw)
          PY
      - name: Publicar foto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f assets/photo_part0.txt assets/photo_part1.txt assets/photo_part2.txt assets/photo_part3.txt assets/photo_part4.txt
          git add assets/casal-bodas.jpg
          git add -u assets/
          git commit -m "Atualizar foto original suavizada do convite" || exit 0
          git push
