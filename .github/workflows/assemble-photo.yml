name: Montar foto do convite
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e substituir foto
        run: |
          : > /tmp/photo.jpg
          for n in 0 1 2 3 4; do
            echo "Decodificando parte $n"
            base64 -d "assets/photo_part${n}.txt" >> /tmp/photo.jpg
          done
          file /tmp/photo.jpg
          cp /tmp/photo.jpg assets/casal-bodas.jpg
      - name: Publicar foto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f assets/photo_part0.txt assets/photo_part1.txt assets/photo_part2.txt assets/photo_part3.txt assets/photo_part4.txt
          git add assets/casal-bodas.jpg
          git add -u assets/
          git commit -m "Atualizar foto original suavizada do convite" || exit 0
          git push
